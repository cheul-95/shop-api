spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:shop}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    defer-datasource-initialization: true

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      encoding: UTF-8

server:
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration: 3600000
  refresh-token:
    expiration: 604800000

logging:
  level:
    root: info
    org.hibernate.SQL: warn
